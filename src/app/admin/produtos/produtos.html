<!-- Unidade do produto -->
<div class="campo" *ngIf="editandoId === null">
  <label for="unidade">Unidade</label>

  <select id="unidade" name="unidade" [(ngModel)]="formulario.unidade" required>
    <option value="UN">Unidade (UN)</option>
    <option value="KG">Quilograma (KG)</option>
    <option value="L">Litro (L)</option>
    <option value="ML">Mililitro (ML)</option>
  </select>
</div>

<!-- Quantidade inicial -->
<div class="campo" *ngIf="editandoId === null">
  <label for="quantidadeInicial">Quantidade inicial</label>

  <input
    id="quantidadeInicial"
    name="quantidadeInicial"
    type="number"
    [(ngModel)]="formulario.quantidadeInicial"
    min="0"
    step="1"
    required
  />
</div>
